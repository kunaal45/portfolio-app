spring.application.name=portfolio-app

# In-memory database - resets every time the app restarts (fine for learning)
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets you view the database in your browser at /h2-console while the app runs
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# "update" = Hibernate creates/updates tables from your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Disable Thymeleaf template cache (dev mode: reload templates on every request)
spring.thymeleaf.cache=false

server.port=${PORT:8081}
